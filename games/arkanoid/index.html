<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арканоид</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        canvas {
            border: 2px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3), 0 0 60px rgba(0, 212, 255, 0.1);
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a3e 100%);
            max-width: 100%;
        }
        #ui {
            margin-top: 15px;
            display: flex;
            gap: 30px;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        #ui span { color: #00d4ff; }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 28px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #message.show { opacity: 1; }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        .back-btn {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid #2a2a2a;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .back-btn:hover {
            background: #2a2a2a;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="../../index.html" class="back-btn">← Назад</a>
    </div>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="ui">
        <div>Очки: <span id="score">0</span></div>
        <div>Жизни: <span id="lives">3</span></div>
        <div>Уровень: <span id="level">1</span></div>
    </div>
    <div class="controls">← → или мышь | Пробел — запуск</div>
    <div id="message"></div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const msgEl = document.getElementById('message');
        
        // Audio context для звуков
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'hit') {
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'brick') {
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'paddle') {
                osc.frequency.setValueAtTime(330, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'lose') {
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                [523, 659, 784, 1047].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(f, now + i * 0.12);
                    g.gain.setValueAtTime(0.15, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.2);
                    o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.2);
                });
            }
        }

        // Игровое состояние
        let score = 0, lives = 3, level = 1;
        let gameState = 'waiting'; // waiting, playing, gameover, victory
        let particles = [];
        
        // Платформа
        const paddle = { width: 120, height: 15, x: 340, speed: 8 };
        
        // Мяч
        const ball = { x: 400, y: 530, radius: 8, dx: 0, dy: 0, speed: 5, baseSpeed: 5 };
        
        // Кирпичи
        let bricks = [];
        const brickColors = ['#ff0040', '#ff4000', '#ff8000', '#ffff00', '#80ff00', '#00ff80', '#00ffff', '#0080ff'];
        
        function createBricks() {
            bricks = [];
            const rows = 5 + level;
            const cols = 10;
            const padding = 8;
            const offsetTop = 60;
            const offsetLeft = 35;
            const brickW = (canvas.width - offsetLeft * 2 - padding * (cols - 1)) / cols;
            const brickH = 22;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push({
                        x: offsetLeft + c * (brickW + padding),
                        y: offsetTop + r * (brickH + padding),
                        w: brickW, h: brickH,
                        color: brickColors[r % brickColors.length],
                        hits: r < 2 ? 2 : 1,
                        maxHits: r < 2 ? 2 : 1,
                        visible: true
                    });
                }
            }
        }
        
        // Частицы
        function spawnParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    life: 1,
                    color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.15; // гравитация
                p.life -= 0.025;
                return p.life > 0;
            });
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Управление
        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.code === 'Space' && gameState === 'waiting') launchBall();
            if (e.code === 'Space' && (gameState === 'gameover' || gameState === 'victory')) resetGame();
        });
        document.addEventListener('keyup', e => keys[e.key] = false);
        
        let mouseX = 400;
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        });
        canvas.addEventListener('click', () => {
            if (gameState === 'waiting') launchBall();
            if (gameState === 'gameover' || gameState === 'victory') resetGame();
        });

        function launchBall() {
            if (gameState !== 'waiting') return;
            gameState = 'playing';
            const angle = (Math.random() * 60 + 60) * Math.PI / 180;
            ball.dx = Math.cos(angle) * ball.speed * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -Math.sin(angle) * ball.speed;
        }

        function resetBall() {
            ball.x = paddle.x + paddle.width / 2;
            ball.y = canvas.height - paddle.height - ball.radius - 5;
            ball.dx = 0;
            ball.dy = 0;
            gameState = 'waiting';
        }

        function resetGame() {
            score = 0; lives = 3; level = 1;
            ball.speed = ball.baseSpeed;
            createBricks();
            resetBall();
            updateUI();
            msgEl.classList.remove('show');
        }

        function nextLevel() {
            level++;
            ball.speed = ball.baseSpeed + level * 0.5;
            createBricks();
            resetBall();
            updateUI();
            showMessage('Уровень ' + level + '!', 1500);
            playSound('win');
        }

        function showMessage(text, duration = 2000) {
            msgEl.textContent = text;
            msgEl.classList.add('show');
            setTimeout(() => msgEl.classList.remove('show'), duration);
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        // Обновление логики
        function update() {
            if (gameState === 'gameover' || gameState === 'victory') return;

            // Движение платформы
            if (keys['ArrowLeft']) paddle.x -= paddle.speed;
            if (keys['ArrowRight']) paddle.x += paddle.speed;
            // Мышь
            if (!keys['ArrowLeft'] && !keys['ArrowRight']) {
                paddle.x = mouseX - paddle.width / 2;
            }
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            // Мяч приклеен к платформе в ожидании
            if (gameState === 'waiting') {
                ball.x = paddle.x + paddle.width / 2;
                ball.y = canvas.height - paddle.height - ball.radius - 5;
                return;
            }

            // Движение мяча
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Отскок от стен
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.dx = -ball.dx;
                ball.x = ball.x < canvas.width / 2 ? ball.radius : canvas.width - ball.radius;
                playSound('hit');
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
                ball.y = ball.radius;
                playSound('hit');
            }

            // Отскок от платформы
            if (ball.y + ball.radius > canvas.height - paddle.height - 5 &&
                ball.y - ball.radius < canvas.height &&
                ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                
                const hitPos = (ball.x - paddle.x) / paddle.width;
                const angle = (hitPos - 0.5) * Math.PI / 2.5; // угол от -60 до +60 градусов
                const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                ball.dx = Math.sin(angle) * speed;
                ball.dy = -Math.cos(angle) * speed;
                ball.y = canvas.height - paddle.height - ball.radius - 6;
                playSound('paddle');
                spawnParticles(ball.x, ball.y, '#00d4ff', 5);
            }

            // Падение мяча
            if (ball.y > canvas.height) {
                lives--;
                playSound('lose');
                spawnParticles(ball.x, canvas.height - 10, '#ff0040', 15);
                updateUI();
                if (lives <= 0) {
                    gameState = 'gameover';
                    showMessage('Игра окончена! Пробел — заново');
                } else {
                    resetBall();
                    showMessage('Жизнь потеряна!');
                }
            }

            // Столкновение с кирпичами
            for (let b of bricks) {
                if (!b.visible) continue;
                if (ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.w &&
                    ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.h) {
                    
                    b.hits--;
                    if (b.hits <= 0) {
                        b.visible = false;
                        score += (b.maxHits === 2 ? 20 : 10) * level;
                        spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color, 12);
                    } else {
                        score += 10 * level;
                        spawnParticles(b.x + b.w/2, b.y + b.h/2, '#fff', 6);
                    }
                    playSound('brick');
                    updateUI();

                    // Определяем с какой стороны удар
                    const overlapLeft = (ball.x + ball.radius) - b.x;
                    const overlapRight = (b.x + b.w) - (ball.x - ball.radius);
                    const overlapTop = (ball.y + ball.radius) - b.y;
                    const overlapBottom = (b.y + b.h) - (ball.y - ball.radius);
                    const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

                    if (minOverlap === overlapLeft || minOverlap === overlapRight) ball.dx = -ball.dx;
                    else ball.dy = -ball.dy;

                    break; // один удар за кадр
                }
            }

            // Проверка победы
            if (bricks.every(b => !b.visible)) {
                nextLevel();
            }

            updateParticles();
        }

        // Отрисовка
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Фоновые звёзды
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 50; i++) {
                const sx = (i * 137.5 + level * 50) % canvas.width;
                const sy = (i * 73.3) % canvas.height;
                const twinkle = Math.sin(Date.now() * 0.003 + i) * 0.5 + 0.5;
                ctx.globalAlpha = twinkle * 0.5;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }
            ctx.globalAlpha = 1;

            // Кирпичи
            bricks.forEach(b => {
                if (!b.visible) return;
                const glow = b.hits < b.maxHits ? 15 : 0;
                
                ctx.shadowColor = b.color;
                ctx.shadowBlur = glow;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                
                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(b.x, b.y, b.w, 4);
                
                // Трещина если повреждён
                if (b.hits < b.maxHits) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(b.x + 5, b.y + 5);
                    ctx.lineTo(b.x + b.w - 5, b.y + b.h - 5);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            });

            // Платформа
            ctx.shadowColor = '#00d4ff';
            ctx.shadowBlur = 15;
            const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.width, 0);
            grad.addColorStop(0, '#0088cc');
            grad.addColorStop(0.5, '#00d4ff');
            grad.addColorStop(1, '#0088cc');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(paddle.x, canvas.height - paddle.height - 5, paddle.width, paddle.height, 8);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Мяч
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            // Блик на мяче
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(ball.x - 2, ball.y - 2, ball.radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Частицы
            drawParticles();

            // Трейл мяча
            if (gameState === 'playing') {
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ball.x - ball.dx * 2, ball.y - ball.dy * 2, ball.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 0.15;
                ctx.beginPath();
                ctx.arc(ball.x - ball.dx * 4, ball.y - ball.dy * 4, ball.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Старт
        createBricks();
        resetBall();
        updateUI();
        showMessage('Пробел — начать!', 3000);
        gameLoop();
    </script>
</body>
</html>

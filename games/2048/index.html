<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 — GameHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0d0d0d;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            touch-action: none;
        }

        .header {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
        }

        .top-panel {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 16px;
        }

        .score-box {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 10px 18px;
            text-align: center;
        }

        .score-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 22px;
            font-weight: 700;
            color: #ffcc00;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #ffcc00;
            color: #000;
        }

        .btn-primary:hover {
            background: #e6b800;
        }

        /* Игровое поле */
        .board-container {
            position: relative;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
            position: relative;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: #111;
            border-radius: 10px;
        }

        .tiles-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 350px;
            height: 350px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            transition: transform 0.18s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            z-index: 2;
        }

        .tile.new {
            animation: popIn 0.2s ease;
        }

        .tile.merge {
            animation: mergePop 0.2s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes mergePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .tile-2    { background: #1a1a2e; color: #eee; }
        .tile-4    { background: #16213e; color: #eee; }
        .tile-8    { background: #0f3460; color: #fff; }
        .tile-16   { background: #e65100; color: #fff; }
        .tile-32   { background: #ef6c00; color: #fff; }
        .tile-64   { background: #f57c00; color: #fff; }
        .tile-128  { background: #fdd835; color: #000; font-size: 26px; box-shadow: 0 0 15px rgba(253, 216, 53, 0.3); }
        .tile-256  { background: #ffcc00; color: #000; font-size: 26px; box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
        .tile-512  { background: #ff9800; color: #000; font-size: 26px; box-shadow: 0 0 25px rgba(255, 152, 0, 0.5); }
        .tile-1024 { background: #ff5722; color: #fff; font-size: 22px; box-shadow: 0 0 30px rgba(255, 87, 34, 0.5); }
        .tile-2048 { background: #4caf50; color: #fff; font-size: 22px; box-shadow: 0 0 40px rgba(76, 175, 80, 0.6); }
        .tile-super { background: #3f51b5; color: #fff; font-size: 18px; box-shadow: 0 0 40px rgba(63, 81, 181, 0.6); }

        /* Оверлеи */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            border-radius: 16px;
            z-index: 20;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .overlay p {
            color: #aaa;
            margin-bottom: 16px;
        }

        /* Мобильные кнопки */
        .mobile-controls {
            display: none;
            margin-top: 16px;
            gap: 6px;
            flex-direction: column;
            align-items: center;
        }

        .mobile-row {
            display: flex;
            gap: 6px;
        }

        .mobile-btn {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-btn:active {
            background: #2a2a2a;
            transform: scale(0.95);
        }

        .controls-hint {
            margin-top: 12px;
            color: #666;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 450px) {
            .board {
                grid-template-columns: repeat(4, 65px);
                grid-template-rows: repeat(4, 65px);
                gap: 8px;
            }
            .cell {
                width: 65px;
                height: 65px;
            }
            .tile {
                width: 65px;
                height: 65px;
                font-size: 22px;
            }
            .tile-128, .tile-256, .tile-512 {
                font-size: 20px;
            }
            .tile-1024, .tile-2048 {
                font-size: 16px;
            }
            .tile-super {
                font-size: 14px;
            }
            .tiles-layer {
                width: 284px;
                height: 284px;
            }
            .mobile-controls {
                display: flex;
            }
            .controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="../../index.html" class="back-btn">← Назад</a>
        <div class="game-title">🔢 2048</div>
        <div style="width:80px;"></div>
    </div>

    <div class="top-panel">
        <div class="score-box">
            <div class="score-label">Счёт</div>
            <div class="score-value" id="score">0</div>
        </div>
        <button class="btn btn-primary" id="restartBtn">Новая игра</button>
        <div class="score-box">
            <div class="score-label">Рекорд</div>
            <div class="score-value" id="highScore">0</div>
        </div>
    </div>

    <div class="board-container">
        <div class="board" id="board">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div class="tiles-layer" id="tilesLayer"></div>

        <div class="overlay hidden" id="gameOverScreen">
            <h2>💀 Game Over</h2>
            <p>Счёт: <span id="finalScore">0</span></p>
            <button class="btn btn-primary" id="gameOverRestart">Ещё раз</button>
            <a href="../../index.html" class="btn btn-secondary" style="display:inline-block;text-decoration:none;margin-top:8px;">Меню</a>
        </div>

        <div class="overlay hidden" id="winScreen">
            <h2>🎉 Победа!</h2>
            <p>Ты собрал 2048!</p>
            <button class="btn btn-primary" id="continueBtn">Продолжить</button>
        </div>
    </div>

    <p class="controls-hint">← → ↑ ↓ / WASD — движение</p>

    <div class="mobile-controls">
        <div class="mobile-row">
            <button class="mobile-btn" data-dir="up">↑</button>
        </div>
        <div class="mobile-row">
            <button class="mobile-btn" data-dir="left">←</button>
            <button class="mobile-btn" data-dir="down">↓</button>
            <button class="mobile-btn" data-dir="right">→</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const tilesLayer = document.getElementById('tilesLayer');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const winScreen = document.getElementById('winScreen');

        const GRID_SIZE = window.innerWidth <= 450 ? 65 : 80;
        const GAP = window.innerWidth <= 450 ? 8 : 10;

        let grid = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('2048highScore') || '0');
        let hasWon = false;
        let isAnimating = false;

        // Аудио
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return;
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        }
        function playSlideSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
        function playMergeSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }
        function playGameOverSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        highScoreEl.textContent = highScore;

        function posToPixel(r, c) {
            return {
                x: c * (GRID_SIZE + GAP),
                y: r * (GRID_SIZE + GAP)
            };
        }

        function initGame() {
            initAudio();
            grid = Array.from({ length: 4 }, () => Array(4).fill(0));
            score = 0;
            hasWon = false;
            isAnimating = false;
            scoreEl.textContent = '0';
            gameOverScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            tilesLayer.innerHTML = '';
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) empty.push({ r, c });
                }
            }
            if (empty.length === 0) return null;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            return { r, c, value: grid[r][c] };
        }

        function getTileClass(value) {
            if (value <= 2048) return `tile-${value}`;
            return 'tile-super';
        }

        function render() {
            tilesLayer.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] !== 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile ${getTileClass(grid[r][c])}`;
                        tile.textContent = grid[r][c];
                        const p = posToPixel(r, c);
                        tile.style.left = p.x + 'px';
                        tile.style.top = p.y + 'px';
                        tilesLayer.appendChild(tile);
                    }
                }
            }
        }

        function renderAnimated(oldGrid, newTile) {
            tilesLayer.innerHTML = '';

            // Собираем все старые плитки
            let oldTiles = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (oldGrid[r][c] !== 0) {
                        oldTiles.push({ r, c, value: oldGrid[r][c], used: false });
                    }
                }
            }

            // Рисуем плитки на новых позициях
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) continue;

                    const tile = document.createElement('div');
                    tile.className = `tile ${getTileClass(grid[r][c])}`;
                    tile.textContent = grid[r][c];
                    const p = posToPixel(r, c);
                    tile.style.left = p.x + 'px';
                    tile.style.top = p.y + 'px';

                    // Проверяем, является ли плитка новой (только что добавленной)
                    const isNew = newTile && newTile.r === r && newTile.c === c;

                    if (!isNew) {
                        // Ищем соответствие в старом grid
                        const match = oldTiles.find(t => t.value === grid[r][c] && !t.used);
                        if (match) {
                            match.used = true;
                            const oldP = posToPixel(match.r, match.c);
                            const dx = oldP.x - p.x;
                            const dy = oldP.y - p.y;
                            if (dx !== 0 || dy !== 0) {
                                tile.style.transform = `translate(${dx}px, ${dy}px)`;
                            }
                        } else {
                            // Слияние — пульсация
                            tile.classList.add('merge');
                        }
                    } else {
                        tile.classList.add('new');
                    }

                    tilesLayer.appendChild(tile);
                }
            }

            // Запускаем анимацию движения в следующем кадре
            requestAnimationFrame(() => {
                const tiles = tilesLayer.querySelectorAll('.tile:not(.new)');
                tiles.forEach(t => { t.style.transform = 'translate(0, 0)'; });
            });
        }

        function slideRowLeft(row) {
            let filtered = row.filter(x => x !== 0);
            let result = [];
            let merged = false;
            for (let i = 0; i < filtered.length; i++) {
                if (i < filtered.length - 1 && filtered[i] === filtered[i + 1]) {
                    result.push(filtered[i] * 2);
                    score += filtered[i] * 2;
                    i++;
                    merged = true;
                } else {
                    result.push(filtered[i]);
                }
            }
            while (result.length < 4) result.push(0);
            return { row: result, changed: JSON.stringify(row) !== JSON.stringify(result), merged };
        }

        function moveLeft() {
            let changed = false;
            for (let r = 0; r < 4; r++) {
                const res = slideRowLeft(grid[r]);
                if (res.changed) { changed = true; grid[r] = res.row; }
            }
            return changed;
        }

        function moveRight() {
            let changed = false;
            for (let r = 0; r < 4; r++) {
                const res = slideRowLeft([...grid[r]].reverse());
                if (res.changed) { changed = true; grid[r] = res.row.reverse(); }
            }
            return changed;
        }

        function moveUp() {
            let changed = false;
            for (let c = 0; c < 4; c++) {
                const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                const res = slideRowLeft(col);
                if (res.changed) {
                    changed = true;
                    for (let r = 0; r < 4; r++) grid[r][c] = res.row[r];
                }
            }
            return changed;
        }

        function moveDown() {
            let changed = false;
            for (let c = 0; c < 4; c++) {
                const res = slideRowLeft([grid[0][c], grid[1][c], grid[2][c], grid[3][c]].reverse());
                if (res.changed) {
                    changed = true;
                    const newCol = res.row.reverse();
                    for (let r = 0; r < 4; r++) grid[r][c] = newCol[r];
                }
            }
            return changed;
        }

        function makeMove(direction) {
            if (isAnimating) return;

            const oldGrid = grid.map(row => [...row]);
            let changed = false;
            let merged = false;
            if (direction === 'left') {
                for (let r = 0; r < 4; r++) {
                    const res = slideRowLeft(grid[r]);
                    if (res.changed) { changed = true; grid[r] = res.row; }
                    if (res.merged) merged = true;
                }
            }
            if (direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    const res = slideRowLeft([...grid[r]].reverse());
                    if (res.changed) { changed = true; grid[r] = res.row.reverse(); }
                    if (res.merged) merged = true;
                }
            }
            if (direction === 'up') {
                for (let c = 0; c < 4; c++) {
                    const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                    const res = slideRowLeft(col);
                    if (res.changed) {
                        changed = true;
                        for (let r = 0; r < 4; r++) grid[r][c] = res.row[r];
                    }
                    if (res.merged) merged = true;
                }
            }
            if (direction === 'down') {
                for (let c = 0; c < 4; c++) {
                    const res = slideRowLeft([grid[0][c], grid[1][c], grid[2][c], grid[3][c]].reverse());
                    if (res.changed) {
                        changed = true;
                        const newCol = res.row.reverse();
                        for (let r = 0; r < 4; r++) grid[r][c] = newCol[r];
                    }
                    if (res.merged) merged = true;
                }
            }

            if (changed) {
                isAnimating = true;
                if (merged) playMergeSound();
                else playSlideSound();
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('2048highScore', highScore);
                }

                const newTile = addRandomTile();
                renderAnimated(oldGrid, newTile);

                if (!hasWon && grid.some(row => row.includes(2048))) {
                    hasWon = true;
                    setTimeout(() => winScreen.classList.remove('hidden'), 400);
                }

                if (isGameOver()) {
                    setTimeout(() => {
                        playGameOverSound();
                        finalScoreEl.textContent = score;
                        gameOverScreen.classList.remove('hidden');
                    }, 400);
                }

                setTimeout(() => { isAnimating = false; }, 200);
            }
        }

        function isGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            return true;
        }

        // Клавиатура
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a') { e.preventDefault(); makeMove('left'); }
            if (key === 'arrowright' || key === 'd') { e.preventDefault(); makeMove('right'); }
            if (key === 'arrowup' || key === 'w') { e.preventDefault(); makeMove('up'); }
            if (key === 'arrowdown' || key === 's') { e.preventDefault(); makeMove('down'); }
        });

        // Свайпы
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                makeMove(dx > 0 ? 'right' : 'left');
            } else {
                makeMove(dy > 0 ? 'down' : 'up');
            }
        }, { passive: true });

        // Мобильные кнопки
        document.querySelectorAll('.mobile-btn').forEach(btn => {
            const handler = (e) => {
                e.preventDefault();
                makeMove(btn.dataset.dir);
            };
            btn.addEventListener('touchstart', handler);
            btn.addEventListener('mousedown', handler);
        });

        // Кнопки
        document.getElementById('restartBtn').addEventListener('click', initGame);
        document.getElementById('gameOverRestart').addEventListener('click', initGame);
        document.getElementById('continueBtn').addEventListener('click', () => {
            winScreen.classList.add('hidden');
        });

        // Старт
        initGame();
    </script>
</body>
</html>

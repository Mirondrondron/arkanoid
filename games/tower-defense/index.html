<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tower Defense — GameHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #gameWrap {
            position: relative;
            border: 2px solid #2a2a2a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.1);
        }
        canvas { display: block; touch-action: none; }
        .header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        .back-btn {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .back-btn:hover { background: #2a2a2a; color: #fff; }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.88);
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h2 { font-size: 32px; margin-bottom: 12px; }
        .overlay p { color: #aaa; margin-bottom: 8px; font-size: 16px; }
        .overlay .score-big { font-size: 48px; font-weight: 800; color: #ffcc00; margin: 8px 0 20px; }
        .btn {
            padding: 12px 32px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 4px;
        }
        .btn-primary { background: #ffcc00; color: #000; }
        .btn-primary:hover { background: #e6b800; transform: scale(1.05); }
        .btn-secondary { background: #2a2a2a; color: #fff; }
        .btn-secondary:hover { background: #3a3a3a; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../../index.html" class="back-btn">← Назад</a>
    </div>

    <div id="gameWrap">
        <canvas id="game" width="960" height="700"></canvas>

        <div class="overlay" id="startScreen">
            <h2>🏰 Tower Defense</h2>
            <p>Строй башни, защищай базу!</p>
            <div class="score-big">Уровень 1</div>
            <button class="btn btn-primary" id="startBtn">Играть</button>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h2>💀 Поражение</h2>
            <p>Волна: <span id="finalWave" style="color:#ffcc00;font-weight:800;">1</span></p>
            <p>Счёт: <span id="finalScore" style="color:#ffcc00;font-weight:800;">0</span></p>
            <button class="btn btn-primary" id="restartBtn">Заново</button>
            <a href="../../index.html" class="btn btn-secondary" style="display:inline-block;text-decoration:none;">Меню</a>
        </div>

        <div class="overlay hidden" id="victoryScreen">
            <h2>🏆 Победа!</h2>
            <p>Ты отбил все волны!</p>
            <div class="score-big" id="victoryScore">0</div>
            <button class="btn btn-primary" id="newGameBtn">Новая игра</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // Audio
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            const now = audioCtx.currentTime;
            if (type === 'shoot') {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.setValueAtTime(800, now);
                g.gain.setValueAtTime(0.08, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                o.start(now); o.stop(now + 0.08);
            } else if (type === 'hit') {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = 'square';
                o.frequency.setValueAtTime(200, now);
                g.gain.setValueAtTime(0.1, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                o.start(now); o.stop(now + 0.1);
            } else if (type === 'build') {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.setValueAtTime(400, now);
                o.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                g.gain.setValueAtTime(0.1, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                o.start(now); o.stop(now + 0.15);
            } else if (type === 'wave') {
                [300,400,500].forEach((f,i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(f, now+i*0.1);
                    g.gain.setValueAtTime(0.1, now+i*0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now+i*0.1+0.2);
                    o.start(now+i*0.1); o.stop(now+i*0.1+0.2);
                });
            }
        }

        // Game config
        const TILE = 48;
        const GW = 20, GH = 12;
        const WAYPOINTS = [[0,2],[4,2],[4,6],[10,6],[10,3],[16,3],[16,8],[19,8]];

        const TOWER_TYPES = {
            archer: { name: 'Лучник', cost: 50, range: 130, damage: 18, cooldown: 25, color: '#44ff44', projColor: '#88ff88', speed: 8, splash: 0 },
            cannon: { name: 'Пушка', cost: 100, range: 100, damage: 45, cooldown: 80, color: '#ff8800', projColor: '#ffaa33', speed: 5, splash: 70 },
            ice:    { name: 'Лёд', cost: 75, range: 110, damage: 8, cooldown: 40, color: '#00ffff', projColor: '#88ffff', speed: 7, splash: 0, slow: 0.5, slowDur: 90 },
            laser:  { name: 'Лазер', cost: 125, range: 150, damage: 10, cooldown: 6, color: '#ff4444', projColor: '#ff8888', speed: 20, splash: 0 }
        };

        const ENEMY_TYPES = {
            basic: { hp: 80, speed: 1.5, reward: 12, color: '#ff4444', radius: 10 },
            fast:  { hp: 60, speed: 2.6, reward: 18, color: '#ffcc00', radius: 8 },
            tank:  { hp: 300, speed: 0.9, reward: 35, color: '#888888', radius: 14 },
            boss:  { hp: 1200, speed: 0.85, reward: 150, color: '#ff00ff', radius: 20 }
        };

        let gameState = 'waiting';
        let money = 150, lives = 20, wave = 0, score = 0;
        let grid = []; // 0=empty, 1=path, 2=tower
        let towers = [], enemies = [], projectiles = [], particles = [];
        let selectedTowerType = null;
        let selectedTower = null;
        let waveActive = false;
        let waveEnemies = [];
        let waveTimer = 0;
        let waveIndex = 0;
        let mouseX = 0, mouseY = 0;

        // Build grid
        function initGrid() {
            grid = [];
            for (let y = 0; y < GH; y++) {
                grid[y] = [];
                for (let x = 0; x < GW; x++) grid[y][x] = 0;
            }
            // Mark path
            for (let i = 0; i < WAYPOINTS.length - 1; i++) {
                const [x1, y1] = WAYPOINTS[i];
                const [x2, y2] = WAYPOINTS[i+1];
                if (x1 === x2) {
                    for (let y = Math.min(y1,y2); y <= Math.max(y1,y2); y++) grid[y][x1] = 1;
                } else {
                    for (let x = Math.min(x1,x2); x <= Math.max(x1,x2); x++) grid[y1][x] = 1;
                }
            }
        }

        // Utils
        function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }
        function tileCenter(tx,ty) { return {x: tx*TILE+TILE/2, y: ty*TILE+TILE/2}; }

        // Path following
        function getPathPoints() {
            const pts = [];
            for (let i = 0; i < WAYPOINTS.length - 1; i++) {
                const [x1,y1] = WAYPOINTS[i];
                const [x2,y2] = WAYPOINTS[i+1];
                const c1 = tileCenter(x1,y1);
                const c2 = tileCenter(x2,y2);
                const steps = Math.max(Math.abs(x2-x1), Math.abs(y2-y1)) * 4;
                for (let s = 0; s <= steps; s++) {
                    const t = s/steps;
                    pts.push({x: c1.x + (c2.x-c1.x)*t, y: c1.y + (c2.y-c1.y)*t});
                }
            }
            return pts;
        }
        const pathPoints = getPathPoints();

        // Waves
        function makeWave(n) {
            const waves = [
                [{type:'basic', count:5, interval:40}],
                [{type:'basic', count:8, interval:35}],
                [{type:'basic', count:5, interval:35},{type:'fast', count:3, interval:25}],
                [{type:'basic', count:10, interval:30},{type:'fast', count:5, interval:20}],
                [{type:'boss', count:1, interval:60}],
                [{type:'fast', count:12, interval:18},{type:'tank', count:2, interval:60}],
                [{type:'basic', count:15, interval:20},{type:'tank', count:3, interval:50}],
                [{type:'fast', count:10, interval:15},{type:'tank', count:5, interval:45}],
                [{type:'tank', count:6, interval:50}],
                [{type:'boss', count:1, interval:60},{type:'tank', count:3, interval:40}],
                [{type:'basic', count:20, interval:15},{type:'fast', count:10, interval:12}],
                [{type:'fast', count:15, interval:10},{type:'tank', count:5, interval:35},{type:'boss', count:1, interval:80}],
                [{type:'tank', count:10, interval:35}],
                [{type:'basic', count:25, interval:10},{type:'fast', count:15, interval:8}],
                [{type:'boss', count:2, interval:100}],
                [{type:'tank', count:8, interval:30},{type:'fast', count:12, interval:10}],
                [{type:'basic', count:30, interval:8},{type:'tank', count:6, interval:30}],
                [{type:'fast', count:20, interval:8},{type:'tank', count:8, interval:25}],
                [{type:'tank', count:12, interval:25},{type:'boss', count:2, interval:90}],
                [{type:'boss', count:3, interval:120}]
            ];
            return waves[(n-1) % waves.length].map(g => ({
                ...g,
                hpMul: 1 + Math.floor((n-1)/waves.length) * 0.6
            }));
        }

        function spawnEnemy(type, hpMul) {
            const t = ENEMY_TYPES[type];
            const start = tileCenter(WAYPOINTS[0][0], WAYPOINTS[0][1]);
            enemies.push({
                x: start.x, y: start.y,
                hp: t.hp * hpMul, maxHp: t.hp * hpMul,
                speed: t.speed, baseSpeed: t.speed,
                reward: t.reward,
                color: t.color, radius: t.radius,
                pathIdx: 0, slowTimer: 0,
                flash: 0
            });
        }

        // Particles
        function spawnParticles(x, y, color, count=6) {
            for (let i=0;i<count;i++) {
                particles.push({
                    x,y,
                    dx:(Math.random()-0.5)*5,
                    dy:(Math.random()-0.5)*5,
                    life:1,color,
                    size:Math.random()*3+2
                });
            }
        }

        // Input
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX-rect.left)*(canvas.width/rect.width);
            mouseY = (e.clientY-rect.top)*(canvas.height/rect.height);
        });
        function handleClick(mx, my) {
            if (gameState !== 'playing') return;
            const tx = Math.floor(mx/TILE), ty = Math.floor(my/TILE);
            if (tx < 0 || tx >= GW || ty < 0 || ty >= GH) return;

            // Check if clicked on tower
            const clickedTower = towers.find(t => t.tx === tx && t.ty === ty);
            if (clickedTower) {
                selectedTower = clickedTower;
                selectedTowerType = null;
                return;
            }

            // Build tower
            if (selectedTowerType && grid[ty][tx] === 0) {
                const type = TOWER_TYPES[selectedTowerType];
                if (money >= type.cost) {
                    money -= type.cost;
                    grid[ty][tx] = 2;
                    const c = tileCenter(tx,ty);
                    towers.push({
                        tx, ty, x: c.x, y: c.y,
                        type: selectedTowerType,
                        level: 1,
                        cooldown: 0,
                        cooldownMax: type.cooldown,
                        ...type
                    });
                    playSound('build');
                    spawnParticles(c.x, c.y, type.color, 12);
                    selectedTowerType = null;
                }
                return;
            }

            selectedTower = null;
        }

        // UI buttons (drawn on canvas)
        const UI_Y = GH*TILE + 4;
        const UI_H = 640 - UI_Y;
        const BTN_W = 90, BTN_H = 36;

        function getTowerButtons() {
            const btns = [];
            const types = Object.keys(TOWER_TYPES);
            const startX = 20;
            const gap = 12;
            types.forEach((key,i) => {
                btns.push({
                    x: startX + i*(BTN_W+gap), y: UI_Y + 10,
                    w: BTN_W, h: BTN_H,
                    type: key,
                    label: TOWER_TYPES[key].name,
                    cost: TOWER_TYPES[key].cost
                });
            });
            // Start wave button
            btns.push({
                x: startX + types.length*(BTN_W+gap) + 30, y: UI_Y + 10,
                w: 120, h: BTN_H,
                action: 'startWave',
                label: waveActive ? 'Волна...' : 'Начать волну',
                color: waveActive ? '#555' : '#ffcc00'
            });
            return btns;
        }

        function handleUIClick(mx, my) {
            if (my < UI_Y) return false;
            const btns = getTowerButtons();
            for (const b of btns) {
                if (mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) {
                    if (b.action === 'startWave' && !waveActive) {
                        startWave();
                    } else if (b.type) {
                        selectedTowerType = selectedTowerType === b.type ? null : b.type;
                        selectedTower = null;
                    }
                    return true;
                }
            }
            // Upgrade / sell buttons
            if (selectedTower) {
                const upCost = Math.floor(selectedTower.cost * 0.7 * selectedTower.level);
                const sellPrice = Math.floor(selectedTower.cost * 0.5 * selectedTower.level);
                const ux = canvas.width - 200, uy = UI_Y + 10;
                if (mx >= ux && mx <= ux+90 && my >= uy && my <= uy+BTN_H) {
                    if (money >= upCost) {
                        money -= upCost;
                        selectedTower.level++;
                        selectedTower.damage *= 1.3;
                        selectedTower.range *= 1.1;
                        playSound('build');
                    }
                    return true;
                }
                if (mx >= ux+100 && mx <= ux+190 && my >= uy && my <= uy+BTN_H) {
                    money += sellPrice;
                    grid[selectedTower.ty][selectedTower.tx] = 0;
                    towers = towers.filter(t => t !== selectedTower);
                    selectedTower = null;
                    playSound('build');
                    return true;
                }
            }
            return false;
        }

        canvas.addEventListener('click', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX-rect.left)*(canvas.width/rect.width);
            const my = (e.clientY-rect.top)*(canvas.height/rect.height);
            if (handleUIClick(mx, my)) return;
            handleClick(mx, my);
        });

        function startWave() {
            if (waveActive) return;
            wave++;
            waveActive = true;
            waveEnemies = [];
            const defs = makeWave(wave);
            defs.forEach(g => {
                for (let i=0;i<g.count;i++) {
                    waveEnemies.push({type: g.type, hpMul: g.hpMul, delay: i*g.interval});
                }
            });
            waveTimer = 0;
            playSound('wave');
        }

        // Update
        function update() {
            if (gameState !== 'playing') return;

            // Spawn wave enemies
            if (waveActive) {
                waveTimer++;
                while (waveEnemies.length > 0 && waveEnemies[0].delay <= waveTimer) {
                    const e = waveEnemies.shift();
                    spawnEnemy(e.type, e.hpMul);
                }
                if (waveEnemies.length === 0 && enemies.length === 0) {
                    waveActive = false;
                    if (wave >= 20) {
                        gameState = 'victory';
                        document.getElementById('victoryScore').textContent = score;
                        document.getElementById('victoryScreen').classList.remove('hidden');
                    }
                }
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.slowTimer > 0) {
                    e.slowTimer--;
                    e.speed = e.baseSpeed * 0.5;
                } else {
                    e.speed = e.baseSpeed;
                }
                if (e.flash > 0) e.flash--;

                // Move along path
                const targetIdx = Math.min(e.pathIdx + 1, pathPoints.length - 1);
                const target = pathPoints[targetIdx];
                const d = Math.hypot(target.x - e.x, target.y - e.y);
                if (d < e.speed) {
                    e.x = target.x; e.y = target.y;
                    e.pathIdx = targetIdx;
                } else {
                    e.x += (target.x - e.x) / d * e.speed;
                    e.y += (target.y - e.y) / d * e.speed;
                }

                if (e.pathIdx >= pathPoints.length - 1) {
                    lives--;
                    enemies.splice(i, 1);
                    if (lives <= 0) {
                        gameState = 'gameover';
                        document.getElementById('finalWave').textContent = wave;
                        document.getElementById('finalScore').textContent = score;
                        document.getElementById('gameOverScreen').classList.remove('hidden');
                    }
                }
            }

            // Towers shoot
            towers.forEach(t => {
                if (t.cooldown > 0) t.cooldown--;
                if (t.cooldown <= 0) {
                    // Find target
                    let best = null, bestDist = Infinity;
                    enemies.forEach(e => {
                        const d = Math.hypot(e.x - t.x, e.y - t.y);
                        if (d <= t.range && d < bestDist) {
                            bestDist = d;
                            best = e;
                        }
                    });
                    if (best) {
                        t.cooldown = t.cooldownMax;
                        const angle = Math.atan2(best.y - t.y, best.x - t.x);
                        projectiles.push({
                            x: t.x, y: t.y,
                            dx: Math.cos(angle) * t.speed,
                            dy: Math.sin(angle) * t.speed,
                            damage: t.damage * t.level,
                            color: t.projColor,
                            splash: t.splash,
                            slow: t.slow,
                            slowDur: t.slowDur,
                            target: best,
                            life: 120
                        });
                        playSound('shoot');
                    }
                }
            });

            // Update projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life--;

                // Homing for slow projectiles
                if (p.target && p.splash === 0 && p.life > 100) {
                    const angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
                    p.dx = Math.cos(angle) * 8;
                    p.dy = Math.sin(angle) * 8;
                }

                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 6) {
                        hit = true;
                        if (p.splash > 0) {
                            enemies.forEach(ee => {
                                if (Math.hypot(ee.x - p.x, ee.y - p.y) < p.splash) {
                                    ee.hp -= p.damage;
                                    ee.flash = 4;
                                    if (p.slow) { ee.slowTimer = p.slowDur; }
                                }
                            });
                            spawnParticles(p.x, p.y, p.color, 10);
                        } else {
                            e.hp -= p.damage;
                            e.flash = 4;
                            if (p.slow) { e.slowTimer = p.slowDur; }
                            spawnParticles(p.x, p.y, p.color, 4);
                        }
                        break;
                    }
                }

                if (hit || p.life <= 0 || p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }

            // Remove dead enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (enemies[i].hp <= 0) {
                    money += enemies[i].reward;
                    score += enemies[i].reward;
                    spawnParticles(enemies[i].x, enemies[i].y, enemies[i].color, 10);
                    enemies.splice(i, 1);
                    playSound('hit');
                }
            }

            // Update particles
            particles = particles.filter(p => {
                p.x += p.dx; p.y += p.dy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }

        // Draw
        function draw() {
            ctx.fillStyle = '#0a0a1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            for (let x = 0; x <= GW; x++) {
                ctx.beginPath(); ctx.moveTo(x*TILE, 0); ctx.lineTo(x*TILE, GH*TILE); ctx.stroke();
            }
            for (let y = 0; y <= GH; y++) {
                ctx.beginPath(); ctx.moveTo(0, y*TILE); ctx.lineTo(GW*TILE, y*TILE); ctx.stroke();
            }

            // Path
            ctx.fillStyle = '#1a1a3e';
            for (let y = 0; y < GH; y++) {
                for (let x = 0; x < GW; x++) {
                    if (grid[y][x] === 1) ctx.fillRect(x*TILE+1, y*TILE+1, TILE-2, TILE-2);
                }
            }
            // Path line
            ctx.strokeStyle = 'rgba(100,100,255,0.2)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const start = tileCenter(WAYPOINTS[0][0], WAYPOINTS[0][1]);
            ctx.moveTo(start.x, start.y);
            for (let i = 1; i < WAYPOINTS.length; i++) {
                const p = tileCenter(WAYPOINTS[i][0], WAYPOINTS[i][1]);
                ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();

            // Base
            const base = tileCenter(WAYPOINTS[WAYPOINTS.length-1][0], WAYPOINTS[WAYPOINTS.length-1][1]);
            ctx.fillStyle = '#ffcc00';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 15;
            ctx.fillRect(base.x-16, base.y-16, 32, 32);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🏰', base.x, base.y+5);

            // Spawn
            const spawn = tileCenter(WAYPOINTS[0][0], WAYPOINTS[0][1]);
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(spawn.x, spawn.y, 12, 0, Math.PI*2);
            ctx.fill();

            // Towers
            towers.forEach(t => {
                const sz = 16;
                ctx.fillStyle = t.color;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(t.x-sz, t.y-sz, sz*2, sz*2);
                ctx.shadowBlur = 0;
                // Level dots
                ctx.fillStyle = '#fff';
                for (let i=0;i<t.level;i++) {
                    ctx.fillRect(t.x-sz+4+i*6, t.y+sz-6, 4, 4);
                }
                // Selection
                if (selectedTower === t) {
                    ctx.strokeStyle = '#ffcc00';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(t.x-sz-2, t.y-sz-2, sz*2+4, sz*2+4);
                    // Range
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
                    ctx.stroke();
                }
            });

            // Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.flash > 0 ? '#fff' : e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = e.flash > 0 ? 15 : 6;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // HP bar
                const bw = 20, bh = 4;
                ctx.fillStyle = '#333';
                ctx.fillRect(e.x-bw/2, e.y-e.radius-8, bw, bh);
                ctx.fillStyle = '#0f0';
                ctx.fillRect(e.x-bw/2, e.y-e.radius-8, bw*(e.hp/e.maxHp), bh);
                // Slow indicator
                if (e.slowTimer > 0) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius+3, 0, Math.PI*2);
                    ctx.stroke();
                }
            });

            // Projectiles
            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Ghost tower
            if (selectedTowerType) {
                const tx = Math.floor(mouseX/TILE);
                const ty = Math.floor(mouseY/TILE);
                if (tx >= 0 && tx < GW && ty >= 0 && ty < GH && grid[ty][tx] === 0) {
                    const t = TOWER_TYPES[selectedTowerType];
                    const c = tileCenter(tx, ty);
                    ctx.fillStyle = t.color;
                    ctx.globalAlpha = 0.4;
                    ctx.fillRect(c.x-14, c.y-14, 28, 28);
                    ctx.globalAlpha = 0.15;
                    ctx.strokeStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, t.range, 0, Math.PI*2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }

            // UI background
            ctx.fillStyle = '#111';
            ctx.fillRect(0, UI_Y, canvas.width, UI_H);
            ctx.strokeStyle = '#2a2a2a';
            ctx.beginPath(); ctx.moveTo(0, UI_Y); ctx.lineTo(canvas.width, UI_Y); ctx.stroke();

            // UI text
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`💰 ${money}  ❤️ ${lives}  🌊 Волна: ${wave}/20  ⭐ Счёт: ${score}`, 20, UI_Y - 14);

            // Tower buttons
            const btns = getTowerButtons();
            btns.forEach(b => {
                const isSel = b.type && selectedTowerType === b.type;
                ctx.fillStyle = isSel ? '#ffcc00' : (b.color || '#2a2a2a');
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = isSel ? '#000' : '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(b.label, b.x+b.w/2, b.y+16);
                ctx.font = '11px sans-serif';
                if (b.cost) ctx.fillText(`${b.cost}💰`, b.x+b.w/2, b.y+30);
                if (b.action === 'startWave') ctx.fillText(b.label, b.x+b.w/2, b.y+23);
            });

            // Tower info panel
            if (selectedTower) {
                const ux = canvas.width - 210, uy = UI_Y + 6;
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(ux, uy, 200, 52);
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`${selectedTower.name} (ур. ${selectedTower.level})`, ux+8, uy+18);
                ctx.fillText(`💰${Math.floor(selectedTower.damage)} ⚔️ ${Math.floor(selectedTower.range)}`, ux+8, uy+34);

                const upCost = Math.floor(selectedTower.cost * 0.7 * selectedTower.level);
                const sellPrice = Math.floor(selectedTower.cost * 0.5 * selectedTower.level);

                // Upgrade btn
                ctx.fillStyle = money >= upCost ? '#4488ff' : '#333';
                ctx.fillRect(ux, uy+56, 90, 28);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText(`Апгрейд ${upCost}`, ux+45, uy+74);

                // Sell btn
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(ux+100, uy+56, 90, 28);
                ctx.fillStyle = '#fff';
                ctx.fillText(`Продать ${sellPrice}`, ux+145, uy+74);
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            try {
                update();
                draw();
            } catch(e) { console.error(e); }
        }

        function resetGame() {
            gameState = 'playing';
            money = 150; lives = 20; wave = 0; score = 0;
            towers = []; enemies = []; projectiles = []; particles = [];
            selectedTowerType = null; selectedTower = null;
            waveActive = false; waveEnemies = []; waveTimer = 0;
            initGrid();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('victoryScreen').classList.add('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            audioCtx = new AudioContext();
            resetGame();
        });
        document.getElementById('restartBtn').addEventListener('click', resetGame);
        document.getElementById('newGameBtn').addEventListener('click', resetGame);

        initGrid();
        gameLoop();
    </script>
</body>
</html>
